<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cảnh báo thiếu ca | VolunteerLink</title>
  <!-- Nhớ chế độ sáng/tối đã chọn trước khi trang vẽ, để không bị nháy màu -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('vl_theme') || '';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="coordinator-shortage" data-role="coordinator" data-base="../">

  <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>

  <!-- Đầu trang và thanh điều hướng do js/modules/layout.js tự dựng theo vai trò -->
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>

    <main class="main" id="main" tabindex="-1">

      <div class="page-h">
        <div>
          <h1>Cảnh báo thiếu ca</h1>
          <p class="mut">AI-2 · Shift Shortage Predictor: dự báo ca có nguy cơ thiếu người để xử lý sớm.</p>
        </div>
      </div>

      <div class="cols">
        <!-- Form tham số dự báo -->
        <form id="param-form" class="card" novalidate>
          <h2>Tham số dự báo</h2>
          <div class="field">
            <label for="days">Phạm vi</label>
            <select id="days" name="days">
              <option value="7" selected>7 ngày tới</option>
              <option value="14">14 ngày tới</option>
              <option value="30">30 ngày tới</option>
            </select>
          </div>
          <div class="field">
            <label for="thr">Ngưỡng cảnh báo (%)</label>
            <input id="thr" name="thr" type="number" min="10" max="90" value="40">
            <div class="hint">Ca có nguy cơ thiếu người ≥ ngưỡng sẽ được liệt kê.</div>
          </div>
          <div class="err" id="param-err" role="alert"></div>
          <button class="btn primary" type="submit">✨ Dự báo thiếu hụt</button>
        </form>

        <!-- Kết quả AI-2 (JavaScript vẽ) -->
        <section id="ai-root" class="ai-root" aria-label="Kết quả AI"></section>
      </div>

      <section class="card" style="margin-top:14px">
        <h2>Báo cáo đã lưu</h2>
        <div id="history"></div>
      </section>

    </main>
  </div>

  <!-- Thông báo nhỏ (toast) -->
  <div id="toast-region" aria-live="polite"></div>

  <!-- Thứ tự nạp quan trọng: file sau dùng được những gì file trước đã khai báo -->
  <script src="../assets/data/seed.js"></script>
  <script src="../js/modules/utils.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/modules/validators.js"></script>
  <script src="../js/modules/ui.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/layout.js"></script>
  <script src="../js/modules/queries.js"></script>
  <script src="../js/modules/ai.js"></script>
  <script src="../js/modules/coordinator-shortage.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
