<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bảng điều khiển nguồn lực | VolunteerLink</title>
  <!-- Nhớ chế độ sáng/tối đã chọn trước khi trang vẽ, để không bị nháy màu -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('vl_theme') || '';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="coordinator-dashboard" data-role="coordinator" data-base="../">

  <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>

  <!-- Đầu trang và thanh điều hướng do js/modules/layout.js tự dựng theo vai trò -->
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>

    <main class="main" id="main" tabindex="-1">

      <div class="page-h">
        <div>
          <h1>Bảng điều khiển nguồn lực</h1>
          <p class="mut">Cân đối nhu cầu ca và nguồn tình nguyện viên.</p>
        </div>
      </div>

      <!-- Bộ lọc -->
      <form id="filter-form" class="toolbar card">
        <div class="field">
          <label for="range">Khoảng thời gian</label>
          <select id="range" name="range">
            <option value="7">7 ngày tới</option>
            <option value="14" selected>14 ngày tới</option>
            <option value="30">30 ngày tới</option>
          </select>
        </div>
        <div class="field">
          <label for="cat">Lĩnh vực</label>
          <select id="cat" name="cat"></select>
        </div>
      </form>

      <section id="kpi" class="grid g4" style="margin-bottom:14px" aria-label="Chỉ số chính"></section>

      <div class="grid g2">
        <section class="card">
          <h2>Mức lấp đầy các ca sắp tới</h2>
          <div id="bars"></div>
        </section>
        <section class="card">
          <h2>Dự báo nhanh ca có nguy cơ</h2>
          <div id="short"></div>
        </section>
      </div>

      <section class="card" style="margin-top:14px">
        <h2>Cung – cầu theo kỹ năng</h2>
        <div id="skills"></div>
      </section>

    </main>
  </div>

  <!-- Thông báo nhỏ (toast) -->
  <div id="toast-region" aria-live="polite"></div>

  <!-- Thứ tự nạp quan trọng: file sau dùng được những gì file trước đã khai báo -->
  <script src="../assets/data/seed.js"></script>
  <script src="../js/modules/utils.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/modules/validators.js"></script>
  <script src="../js/modules/ui.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/layout.js"></script>
  <script src="../js/modules/queries.js"></script>
  <script src="../js/modules/ai.js"></script>
  <script src="../js/modules/coordinator-dashboard.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
