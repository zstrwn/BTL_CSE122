<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Đăng ký | VolunteerLink</title>

  <script>document.documentElement.dataset.theme=localStorage.getItem('vl_theme')||''</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register" data-base="">
  <main class="auth">
    <section class="auth-l">
      <a class="brand" href="index.html" style="color:#fff">
        <span class="logo" style="background:#fff;color:#1b7f5f" aria-hidden="true">♥</span>
        <b style="font-size:18px">VolunteerLink</b>
      </a>
      <h1>Tham gia cộng đồng tình nguyện.</h1>
      <p>Tình nguyện viên có thể dùng ngay; tổ chức xã hội cần quản trị viên phê duyệt.</p>
      <p style="opacity:.8">Bản mẫu giao diện – dữ liệu giả lập lưu ở trình duyệt, không cần máy chủ.</p>
    </section>

    <section class="auth-r">
      <form id="rf" class="auth-form" novalidate>
        <h2>Đăng ký</h2>

        <fieldset class="roles" id="roles-box">
          <legend>Tôi muốn đăng ký là</legend>
        </fieldset>

        <div class="field" style="margin-top:14px">
          <label for="name">Họ và tên</label>
          <input id="name" name="name" autocomplete="name">
        </div>

        <div class="field" id="org-field" hidden>
          <label for="orgName">Tên tổ chức</label>
          <input id="orgName" name="orgName">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="new-password">
        </div>

        <div class="field">
          <label for="confirm">Nhập lại mật khẩu</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password">
        </div>

        <div id="form-msg" role="status"></div>

        <button class="btn primary" type="submit" style="width:100%;padding:12px">Tạo tài khoản</button>

        <p style="margin-top:14px">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </form>
    </section>
  </main>

  <div id="toast-region" aria-live="polite"></div>

  <script src="assets/data/seed.js"></script>
  <script src="js/modules/utils.js"></script>
  <script src="js/modules/store.js"></script>
  <script src="js/modules/api.js"></script>
  <script src="js/modules/validators.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/shared.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
