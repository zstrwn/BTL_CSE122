<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Quản lý danh mục | VolunteerLink</title>

    <script>
      document.documentElement.dataset.theme = localStorage.getItem('vl_theme') || '';
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>

  <body data-page="admin-category-management" data-role="admin" data-base="../">
    <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>

    <header class="topbar" id="topbar"></header>

    <div class="shell">
      <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>

      <main class="main" id="main" tabindex="-1">
        <div class="page-h">
          <div>
            <h1>Quản lý danh mục</h1>
            <p class="mut">Quản lý danh sách lĩnh vực hoạt động và kỹ năng tình nguyện.</p>
          </div>
          <button id="new" class="btn primary" type="button">Thêm mới</button>
        </div>

        <div id="tabs" class="tabs" role="tablist" aria-label="Loại danh mục"></div>

        <form id="flt" class="toolbar card" role="search">
          <div class="field grow">
            <label for="q">Tìm kiếm</label>
            <input id="q" name="q" type="search" placeholder="Nhập tên lĩnh vực / kỹ năng">
          </div>
        </form>

        <section id="list" aria-live="polite" aria-label="Kết quả"></section>
      </main>
    </div>

    <div id="toast-region" aria-live="polite"></div>

    <script src="../assets/data/seed.js"></script>
    <script src="../js/modules/utils.js"></script>
    <script src="../js/modules/store.js"></script>
    <script src="../js/modules/api.js"></script>
    <script src="../js/modules/render.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
