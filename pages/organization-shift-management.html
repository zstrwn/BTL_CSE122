<!doctype html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý ca | VolunteerLink</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('vl_theme')||''</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-page="organization-shift-management" data-role="organization" data-base="../">
<a class="skip" href="#main">Bỏ qua đến nội dung chính</a>
<header class="topbar" id="topbar"></header>
<div class="shell"><nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
<main class="main" id="main" tabindex="-1">

  <div class="page-h">
    <div>
      <h1>Quản lý ca</h1>
      <p class="mut">Mỗi hoạt động có nhiều ca với số chỗ và khung giờ riêng.</p>
    </div>
    <button id="new" class="btn primary" type="button">+ Tạo ca</button>
  </div>

  <form id="flt" class="toolbar card">
    <div class="field grow">
      <label for="opp">Hoạt động</label>
      <select id="opp" name="opp"></select>
    </div>
    <div class="field">
      <label for="flt-status">Trạng thái</label>
      <select id="flt-status" name="status">
        <option value="">Mọi trạng thái</option>
        <option value="open">Còn chỗ</option>
        <option value="full">Đủ người</option>
        <option value="done">Đã diễn ra</option>
        <option value="cancelled">Đã hủy</option>
      </select>
    </div>
  </form>

  <section id="state-box" aria-live="polite" aria-label="Trạng thái danh sách"></section>

  <div id="table-box" class="tbl-wrap" hidden>
    <table class="stack">
      <caption class="sr">Danh sách ca của tổ chức</caption>
      <thead>
        <tr>
          <th scope="col">Ca</th>
          <th scope="col">Lấp đầy</th>
          <th scope="col">Trạng thái</th>
          <th scope="col">Thao tác</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <template id="tpl-shift">
    <div>
      <div class="field">
        <label for="s-opp">Hoạt động</label>
        <select id="s-opp" name="oppId"></select>
      </div>
      <div class="field">
        <label for="s-date">Ngày</label>
        <input id="s-date" name="date" type="date">
      </div>
      <div class="row">
        <div style="flex:1">
          <div class="field">
            <label for="s-start">Bắt đầu</label>
            <input id="s-start" name="start" type="time">
          </div>
        </div>
        <div style="flex:1">
          <div class="field">
            <label for="s-end">Kết thúc</label>
            <input id="s-end" name="end" type="time">
          </div>
        </div>
      </div>
      <div class="field">
        <label for="s-cap">Số chỗ (1–200)</label>
        <input id="s-cap" name="capacity" type="number" min="1" max="200">
      </div>
      <fieldset>
        <legend>Kỹ năng riêng cho ca (bỏ trống = theo hoạt động)</legend>
        <div class="checks" id="s-skills"></div>
      </fieldset>
    </div>
  </template>

</main></div>
<div id="toast-region" aria-live="polite"></div>
<script src="../assets/data/seed.js"></script><script src="../js/modules/utils.js"></script><script src="../js/modules/store.js"></script><script src="../js/modules/api.js"></script><script src="../js/modules/validators.js"></script><script src="../js/modules/ui.js"></script><script src="../js/modules/auth.js"></script><script src="../js/modules/layout.js"></script><script src="../js/modules/queries.js"></script><script src="../js/modules/ai.js"></script><script src="../js/modules/organization-common.js"></script><script src="../js/modules/organization-shift.js"></script>
<script src="../js/main.js"></script></body></html>
