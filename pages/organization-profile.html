<!doctype html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hồ sơ tổ chức | VolunteerLink</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('vl_theme')||''</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-page="organization-profile" data-role="organization" data-base="../">
<a class="skip" href="#main">Bỏ qua đến nội dung chính</a>
<header class="topbar" id="topbar"></header>
<div class="shell"><nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
<main class="main" id="main" tabindex="-1">

  <div class="page-h">
    <div>
      <h1>Hồ sơ tổ chức</h1>
      <p class="mut">Thông tin hiển thị cho tình nguyện viên.</p>
    </div>
    <button id="edit" class="btn primary" type="button">Sửa hồ sơ</button>
  </div>

  <section id="state-box" aria-live="polite" aria-label="Trạng thái hồ sơ"></section>

  <div id="profile-box" hidden>
    <div class="grid g2">

      <section class="card" aria-labelledby="o-name">
        <div class="row between">
          <h2 id="o-name"></h2>
          <span id="o-status"></span>
        </div>
        <p id="o-mission"></p>
        <p class="mut" id="o-contact"></p>
      </section>

      <section class="card" aria-labelledby="o-acts">
        <h2 id="o-acts">Hoạt động của tổ chức</h2>
        <div class="grid g4">
          <div class="kpi"><b id="k-opps">0</b><span>Hoạt động</span></div>
          <div class="kpi"><b id="k-shifts">0</b><span>Ca</span></div>
          <div class="kpi"><b id="k-hours">0</b><span>Giờ đã ghi nhận</span></div>
        </div>
      </section>

    </div>
  </div>

  <template id="tpl-profile">
    <div>
      <div class="field">
        <label for="p-name">Tên tổ chức</label>
        <input id="p-name" name="name" type="text">
      </div>
      <div class="field">
        <label for="p-mission">Sứ mệnh (tối đa 300 ký tự)</label>
        <textarea id="p-mission" name="mission" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="p-email">Email liên hệ</label>
        <input id="p-email" name="email" type="email">
      </div>
      <div class="field">
        <label for="p-phone">Điện thoại</label>
        <input id="p-phone" name="phone" type="tel">
      </div>
      <div class="field">
        <label for="p-city">Thành phố</label>
        <input id="p-city" name="city" type="text">
      </div>
    </div>
  </template>

</main></div>
<div id="toast-region" aria-live="polite"></div>
<script src="../assets/data/seed.js"></script><script src="../js/modules/utils.js"></script><script src="../js/modules/store.js"></script><script src="../js/modules/api.js"></script><script src="../js/modules/validators.js"></script><script src="../js/modules/ui.js"></script><script src="../js/modules/auth.js"></script><script src="../js/modules/layout.js"></script><script src="../js/modules/queries.js"></script><script src="../js/modules/ai.js"></script><script src="../js/modules/organization-common.js"></script><script src="../js/modules/organization-profile.js"></script>
<script src="../js/main.js"></script></body></html>
