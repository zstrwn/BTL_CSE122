<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tóm tắt tác động | VolunteerLink</title>
  <!-- Nhớ chế độ sáng/tối đã chọn trước khi trang vẽ, để không bị nháy màu -->
  <script>document.documentElement.dataset.theme = localStorage.getItem('vl_theme') || '';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="coordinator-impact" data-role="coordinator" data-base="../">

  <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>

  <!-- Đầu trang và thanh điều hướng do js/modules/layout.js tự dựng theo vai trò -->
  <header class="topbar" id="topbar"></header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>

    <main class="main" id="main" tabindex="-1">

      <div class="page-h">
        <div>
          <h1>Tóm tắt tác động</h1>
          <p class="mut">AI-3 · Impact Summary: tạo tóm tắt đóng góp sau hoạt động, bạn chỉnh sửa rồi chốt.</p>
        </div>
      </div>

      <div class="cols">
        <!-- Form dữ liệu đầu vào -->
        <form id="summary-form" class="card" novalidate>
          <h2>Dữ liệu đầu vào</h2>
          <div class="field">
            <label for="opp">Hoạt động</label>
            <select id="opp" name="opp"></select>
          </div>
          <div class="field">
            <label for="tone">Giọng văn</label>
            <select id="tone" name="tone">
              <option value="trang-trong">Trang trọng</option>
              <option value="than-thien">Thân thiện</option>
              <option value="ngan-gon">Ngắn gọn</option>
            </select>
          </div>
          <div class="err" id="form-err" role="alert"></div>
          <button class="btn primary" type="submit">✨ Tạo tóm tắt</button>
        </form>

        <!-- Kết quả AI-3 (JavaScript vẽ) -->
        <section id="ai-root" class="ai-root" aria-label="Kết quả AI"></section>
      </div>

      <section class="card" style="margin-top:14px">
        <h2>Tóm tắt đã lưu</h2>
        <div id="saved"></div>
      </section>

    </main>
  </div>

  <!-- Thông báo nhỏ (toast) -->
  <div id="toast-region" aria-live="polite"></div>

  <!-- Thứ tự nạp quan trọng: file sau dùng được những gì file trước đã khai báo -->
  <script src="../assets/data/seed.js"></script>
  <script src="../js/modules/utils.js"></script>
  <script src="../js/modules/store.js"></script>
  <script src="../js/modules/api.js"></script>
  <script src="../js/modules/validators.js"></script>
  <script src="../js/modules/ui.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/layout.js"></script>
  <script src="../js/modules/queries.js"></script>
  <script src="../js/modules/ai.js"></script>
  <script src="../js/modules/coordinator-impact.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
