<!doctype html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cài đặt | VolunteerLink</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('vl_theme')||''</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-page="settings" data-role="any" data-base="../">
<a class="skip" href="#main">Bỏ qua đến nội dung chính</a>
<header class="topbar" id="topbar"></header>
<div class="shell"><nav class="sidebar" id="sidebar" aria-label="Điều hướng chính"></nav>
<main class="main" id="main" tabindex="-1">
<div class="page-h"><div><h1>Cài đặt</h1><p class="mut">Giao diện, mô phỏng lỗi để thử trạng thái, bảo mật tài khoản.</p></div></div>
<div class="grid g2"><section class="card"><h2>Giao diện & mô phỏng</h2><p id="acct" class="mut"></p><div class="field"><label for="theme">Chế độ màu</label><select id="theme"><option value="system">Theo hệ thống</option><option value="light">Sáng</option><option value="dark">Tối</option></select></div>
<div class="checks" style="flex-direction:column"><label><input type="checkbox" id="sim-error"> Mô phỏng lỗi mạng (thử trạng thái lỗi + Thử lại)</label><label><input type="checkbox" id="sim-ai"> Mô phỏng AI thất bại (thử Thử lại / Dùng thủ công / Báo cáo)</label></div>
<p style="margin-top:14px"><button class="btn danger" id="reset" type="button">Đặt lại dữ liệu demo</button></p></section>
<form id="pf" class="card" novalidate><h2>Đổi mật khẩu</h2><div class="field"><label for="current">Mật khẩu hiện tại</label><input id="current" name="current" type="password" autocomplete="current-password"></div><div class="field"><label for="next">Mật khẩu mới</label><input id="next" name="next" type="password" autocomplete="new-password"></div><div class="field"><label for="again">Nhập lại mật khẩu mới</label><input id="again" name="again" type="password" autocomplete="new-password"></div><div id="pf-msg" role="status"></div><button class="btn primary" type="submit">Cập nhật mật khẩu</button></form></div>
</main></div>
<div id="toast-region" aria-live="polite"></div>
<script src="../assets/data/seed.js"></script><script src="../js/modules/utils.js"></script><script src="../js/modules/store.js"></script><script src="../js/modules/api.js"></script><script src="../js/modules/validators.js"></script><script src="../js/modules/ui.js"></script><script src="../js/modules/auth.js"></script><script src="../js/modules/layout.js"></script><script src="../js/modules/queries.js"></script><script src="../js/modules/ai.js"></script><script src="../js/modules/shared.js"></script>
<script src="../js/main.js"></script></body></html>
